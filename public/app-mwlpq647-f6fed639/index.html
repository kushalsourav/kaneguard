<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1eb">
    <title>KaneGuard To-Do</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 3.5 27 8v7.4c0 6.7-4.5 11.2-11 13.1-6.5-1.9-11-6.4-11-13.1V8l11-4.5Z" fill="currentColor"/><path d="m11.3 16 3.1 3.1 6.7-7" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <p class="eyebrow">YOUR DAILY FOCUS</p>
          <h1>KaneGuard To-Do</h1>
          <p class="intro">A calm place to capture what matters and get it done.</p>
        </div>
      </header>

      <section class="task-card" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading" class="sr-only">Your tasks</h2>
        <form class="task-form" id="task-form" novalidate>
          <label for="task-input">What needs to be done?</label>
          <div class="input-row">
            <input id="task-input" name="task" type="text" maxlength="180" placeholder="Add a new task…" autocomplete="off">
            <button class="add-button" type="submit"><span aria-hidden="true">＋</span>Add task</button>
          </div>
        </form>

        <div class="toolbar">
          <p class="summary" id="task-summary">0 active tasks</p>
          <div class="filters" aria-label="Filter tasks">
            <button class="filter-button is-selected" type="button" data-filter="all" aria-controls="task-list" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-controls="task-list" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-controls="task-list" aria-pressed="false">Completed</button>
          </div>
        </div>

        <div class="task-area">
          <ul class="task-list" id="task-list" aria-label="Task list"></ul>
          <div class="empty-state" id="empty-state">
            <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M14 9.5h20a4 4 0 0 1 4 4v25H10v-25a4 4 0 0 1 4-4Z"/><path d="M18 9.5v-2h12v2M17 20h14M17 27h10"/></svg></div>
            <h3 id="empty-title">Your list is clear</h3>
            <p id="empty-copy">Add your first task above and start making progress.</p>
          </div>
        </div>
      </section>

      <p class="privacy-note">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 8V5.8a3.5 3.5 0 0 1 7 0V8m-8 0h9a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/></svg>
        Tasks stay private in this browser.
      </p>
    </main>
    <div class="sr-only" id="status-message" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
