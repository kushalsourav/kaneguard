<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Tasks</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1 class="app-title">Mini Tasks</h1>
        <p id="task-counter" class="task-counter" aria-live="polite">0 of 0 done</p>
      </header>

      <form id="task-form" class="task-form" novalidate>
        <div class="input-row">
          <label class="sr-only" for="task-input">Task</label>
          <input
            id="task-input"
            class="task-input"
            name="task"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
            aria-describedby="task-error"
          />
          <button type="submit" class="add-button">Add</button>
        </div>
        <p id="task-error" class="error-message" role="alert" aria-live="polite"></p>
      </form>

      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
